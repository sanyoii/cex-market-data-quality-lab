name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    name: Deterministic tests on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e '.[test]'

      - name: Run deterministic tests
        run: python -m pytest tests/unit tests/contract tests/meta -v --junitxml=reports/deterministic-${{ matrix.python-version }}.xml

      - name: Upload deterministic result
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: deterministic-py${{ matrix.python-version }}
          path: reports/deterministic-${{ matrix.python-version }}.xml

  live:
    name: Manually triggered live market-data automation
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e '.[test]'

      - name: Run live tests
        run: python -m pytest tests/live -v -m live --junitxml=reports/live.xml

      - name: Upload live result
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: live-market-data
          path: reports/live.xml
